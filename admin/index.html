<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Controle | TB Gases & Soldas</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo-header.svg" />
  <link rel="icon" type="image/png" href="/assets/img/logo-horizontal.png" />
  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Sveltia CMS: Painel Git-based moderno, ultra-rápido e intuitivo -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

  <script>
    if (window.netlifyIdentity) {
      // Se houver token de convite no admin, abre modal para definir senha
      if (window.location.hash && (
        window.location.hash.indexOf('_token=') !== -1 ||
        window.location.hash.indexOf('invite_token=') !== -1 ||
        window.location.hash.indexOf('recovery_token=') !== -1
      )) {
        window.netlifyIdentity.open();
      }
    }
  </script>
</body>
</html>
